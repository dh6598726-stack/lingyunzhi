<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <title>JIN Tong｜导航收藏</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JIN Tong">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='red' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/><path stroke='white' stroke-width='2' stroke-linecap='round' d='M2 2l20 20M2 7V2h5M17 22h5v-5'/></svg>">
    
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet"/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Long+Cang&display=swap" rel="stylesheet">

  <style>
    /* 全局系统设定与 CSS 变量 */
    :root {
      --font-main: 'Long Cang', "Xingkai SC", "STXingkai", cursive;
      --font-sys: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-sidebar: rgba(255, 255, 255, 0.6); 
      --bg-card: rgba(255, 255, 255, 0.85); /* 提升透明度质感，替代高消耗的滤镜 */
      --border-color: rgba(255, 255, 255, 0.4);
      --border-hover: rgba(0, 122, 255, 0.6);
      --text-main: #1d1d1f;
      --text-sub: #5a5a5e; 
      --accent: #007aff;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.1);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --blur-val: 24px; 
      --transition-fast: 0.2s ease;
      --transition-smooth: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    @keyframes fluidRainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      font-family: var(--font-main);
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #fbc2eb);
      background-size: 400% 400%;
      animation: fluidRainbow 15s ease infinite; /* 保留流体背景 */
      background-attachment: fixed;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      transition: color var(--transition-fast);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body.dark-mode {
      background: linear-gradient(-45deg, #2A0845, #6441A5, #120E1F, #040914, #1D2671);
      background-size: 400% 400%;
      --bg-sidebar: rgba(28, 28, 30, 0.65);
      --bg-card: rgba(44, 44, 46, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(10, 132, 255, 0.5);
      --text-main: #f5f5f7;
      --text-sub: #a1a1a6;
      --accent: #0a84ff;
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,0.4); }

    input, textarea { font-family: var(--font-sys); }
    
    #app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }

    /* 侧边栏保留高斯模糊，因为面积固定，性能开销小 */
    aside {
      background: var(--bg-sidebar);
      backdrop-filter: blur(var(--blur-val));
      -webkit-backdrop-filter: blur(var(--blur-val));
      border-right: 1px solid var(--border-color);
      padding: 32px 24px;
      display: flex; flex-direction: column;
      z-index: 1000;
      will-change: transform;
      transform: translateZ(0); /* 开启硬件加速 */
    }
    
    .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; cursor: pointer; }
    
    @keyframes heartbeat {
      0%, 28%, 70% { transform: scale(1); }
      14%, 42% { transform: scale(1.15); }
    }

    .brand-logo {
      width: 40px; height: 40px; color: #ff3b30; 
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; animation: heartbeat 1.5s infinite ease-in-out; 
      will-change: transform;
    }
    
    .brand-text h1 { font-size: 26px; font-weight: 400; line-height: 1; letter-spacing: 0.5px; }
    .brand-text span { font-size: 14px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; display: block; margin-top: 4px; font-family: var(--font-sys); }

    .search-box { position: relative; margin-bottom: 24px; }
    .search-input {
      width: 100%; padding: 12px 16px 12px 40px; background: rgba(128,128,128, 0.08);
      border: 1px solid var(--border-color); border-radius: var(--radius-sm); 
      color: var(--text-main); font-size: 16px; transition: all var(--transition-fast);
    }
    .search-input:focus { 
      background: var(--bg-card); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); 
    }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-sub); }

    .nav-scroll { flex: 1; overflow-y: auto; padding-right: 8px; }
    
    .nav-item {
      padding: 12px 14px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 500; color: var(--text-sub);
      text-decoration: none; display: flex; align-items: center; gap: 12px; transition: all var(--transition-fast); cursor: pointer; margin-bottom: 4px;
      will-change: transform, background-color;
    }
    .nav-item:hover { background: rgba(128,128,128, 0.1); color: var(--text-main); transform: translateX(4px); }
    .nav-item.active { background: var(--text-main); color: #fff; }
    body.dark-mode .nav-item.active { color: #000; }
    .nav-icon { font-size: 18px; opacity: 0.9; }

    .aside-footer { 
      margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); 
      display: flex; justify-content: space-between; align-items: center; 
    }
    .time-badge {
      font-size: 14px; color: var(--text-sub); font-family: var(--font-sys);
      background: rgba(128,128,128, 0.08); padding: 6px 10px; border-radius: 6px; cursor: default;
      display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-color);
    }
    .time-greeting { font-size: 12px; opacity: 0.8; }

    /* 主内容区 */
    main { padding: 48px 6vw; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

    .hero-quote {
      margin-bottom: 40px; padding: 56px; background-color: #2c2c2e; 
      background-image: url('laopo.png'); background-size: cover; background-position: center;
      border-radius: var(--radius-lg); border: 1px solid var(--border-color);
      box-shadow: var(--shadow-card); position: relative; overflow: hidden;
    }
    .hero-quote::before {
        content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.2)); z-index: 1;
    }
    .quote-text, .quote-sub { position: relative; z-index: 2; }
    .quote-text { font-size: 32px; line-height: 1.6; color: #ffffff; margin-bottom: 12px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
    .quote-sub { font-size: 16px; color: rgba(255,255,255,0.7); letter-spacing: 2px; text-transform: uppercase; font-family: var(--font-sys); }

    .secret-trigger { 
      cursor: pointer; transition: all var(--transition-fast); display: inline-block;
    }
    .secret-trigger:hover { 
      color: #fff; text-shadow: 0 0 12px rgba(255,255,255,0.9); transform: translateY(-2px); 
    }

    .section-block { margin-bottom: 56px; scroll-margin-top: 32px; }
    .section-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
    }
    .section-title { font-size: 22px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px;}
    .section-count { font-size: 14px; color: var(--text-sub); text-transform: uppercase; font-family: var(--font-sys);}

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 优化核心：移除大规模子元素的高斯模糊滤镜，用半透明纯色代替，解决 GPU 重绘管线堵塞 */
    .card {
      background: var(--bg-card); 
      border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px;
      cursor: pointer; display: flex; flex-direction: column; gap: 12px;
      transition: var(--transition-smooth);
      text-decoration: none; color: inherit; 
      opacity: 0; animation: fadeUp 0.4s ease forwards;
      will-change: transform, box-shadow, border-color; /* 提前告知浏览器渲染变化 */
      transform: translateZ(0); /* 强制提升至独立 GPU 渲染层 */
    }
    .card:hover {
      border-color: var(--border-hover); transform: translateY(-5px) scale(1.02);
      box-shadow: var(--shadow-hover); background: var(--bg-sidebar);
    }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .icon-box {
      width: 36px; height: 36px; border-radius: 10px; background: rgba(128,128,128, 0.1);
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-main); border: 1px solid var(--border-color);
    }
    .link-arrow { font-size: 14px; color: var(--text-sub); transition: var(--transition-fast); }
    .card:hover .link-arrow { color: var(--accent); transform: translate(3px, -3px); }
    
    .card-body { display: flex; flex-direction: column; gap: 4px; }
    .card-title { font-size: 18px; font-weight: 600; color: var(--text-main); }
    .card-desc { 
      font-size: 14px; color: var(--text-sub); line-height: 1.4; font-family: var(--font-sys);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    #empty-state { text-align: center; padding: 60px 20px; opacity: 0.6; }
    #empty-state i { font-size: 48px; color: var(--text-sub); margin-bottom: 16px; display: block; }
    #empty-state p { font-size: 16px; color: var(--text-main); font-weight: 500; font-family: var(--font-sys); }

    .time-capsule {
        margin-bottom: 56px; padding: 24px 32px; background: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%);
        border-radius: var(--radius-lg); cursor: pointer; display: flex; align-items: center; justify-content: space-between;
        box-shadow: var(--shadow-hover); border: 1px solid rgba(255,255,255,0.15); position: relative; overflow: hidden; color: #fff;
        transition: transform var(--transition-fast); text-decoration: none; 
        will-change: transform;
    }
    .time-capsule:hover { transform: scale(1.01) translateY(-2px); border-color: rgba(255,255,255,0.4); }
    .time-capsule::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        transform: skewX(-20deg);
    }
    .time-capsule:hover::before { left: 200%; transition: 0.8s ease-in-out; }

    .capsule-left { display: flex; align-items: center; gap: 20px; z-index: 2; }
    .capsule-icon-box {
        width: 48px; height: 48px; background: rgba(255,255,255,0.15); backdrop-filter: blur(5px);
        border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .capsule-info { display: flex; flex-direction: column; }
    .capsule-title { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .capsule-desc { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 4px; font-family: var(--font-sys);}
    .capsule-arrow {
        width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #000;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; opacity: 0; transform: translateX(-15px); transition: all var(--transition-fast);
    }
    .time-capsule:hover .capsule-arrow { opacity: 1; transform: translateX(0); }

    .sensitive-zone { position: relative; transition: all 0.5s ease; }
    .locked { display: none !important; }
    .sensitive-blur { filter: blur(12px); opacity: 0.3; transition: 0.4s ease; will-change: filter, opacity; pointer-events: none;}
    .sensitive-mask {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none;
    }
    .mask-badge {
      background: rgba(0,0,0,0.8); color: #fff; backdrop-filter: blur(4px);
      padding: 8px 16px; border-radius: 8px; font-size: 14px; font-family: var(--font-sys); font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
      transition: var(--transition-fast); box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .sensitive-zone:hover .sensitive-blur { filter: blur(0); opacity: 1; }
    .sensitive-zone.unlocked .sensitive-blur { filter: blur(0); opacity: 1; pointer-events: auto; }
    .sensitive-zone.unlocked .sensitive-mask { display: none; }

    #splash {
      position: fixed; inset: 0; z-index: 9999; 
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #fbc2eb);
      background-size: 400% 400%;
      animation: fluidRainbow 10s ease infinite;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s; user-select: none; 
      will-change: opacity, visibility;
    }
    .splash-quote { 
        font-size: 32px; text-align: center; max-width: 600px; line-height: 1.6; margin-bottom: 40px; padding: 0 20px;
        color: var(--text-main); max-height: 75vh; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }

    #ghost-memo {
      position: fixed; bottom: 40px; right: 40px; width: 340px; height: 460px;
      background: var(--bg-sidebar); color: var(--text-main); backdrop-filter: blur(var(--blur-val)); -webkit-backdrop-filter: blur(var(--blur-val));
      border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column;
      box-shadow: var(--shadow-hover); transform: translateY(30px) scale(0.95); opacity: 0; pointer-events: none;
      transition: var(--transition-smooth); z-index: 1000; font-family: var(--font-sys);
      will-change: transform, opacity;
    }
    #ghost-memo.active { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
    
    #memo-content {
      flex: 1; background: rgba(128,128,128, 0.05); border: none; outline: none; border-radius: 8px; padding: 14px;
      margin-top: 12px; margin-bottom: 12px; overflow-y: auto; scroll-behavior: smooth;
    }
    .memo-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed rgba(128,128,128,0.15);
      color: var(--text-main); font-size: 14px; line-height: 1.6;
    }
    .memo-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .memo-text { 
        flex: 1; word-break: break-all; white-space: pre-wrap; font-family: inherit;
        cursor: pointer; transition: opacity var(--transition-fast);
    }
    .memo-text:hover { opacity: 0.7; }
    .memo-time { font-size: 11px; opacity: 0.5; display: block; margin-bottom: 4px;}
    .memo-delete {
      cursor: pointer; color: #ff3b30; opacity: 0; transition: opacity var(--transition-fast);
      padding: 0 4px; margin-left: 8px; font-weight: bold; font-size: 16px; user-select: none;
    }
    .memo-item:hover .memo-delete { opacity: 0.6; }
    .memo-delete:hover { opacity: 1 !important; transform: scale(1.1); }
    @media (max-width: 768px) { .memo-delete { opacity: 0.8; } }

    #memo-new-record {
      width: 100%; background: rgba(128,128,128, 0.08); border: 1px solid var(--border-color); outline: none; border-radius: 8px; padding: 12px;
      color: var(--text-main); font-size: 14px; transition: all var(--transition-fast); font-family: inherit;
    }
    #memo-new-record:focus { background: var(--bg-sidebar); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); }

    #panic-overlay {
      position: fixed; inset: 0; background: #ffffff; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; font-family: monospace;
    }
    #panic-overlay.active { opacity: 1; pointer-events: auto; }
    .glitch-wrapper { position: relative; }
    .glitch { font-size: 100px; margin: 0; color: #333; position: relative; font-weight: bold; }
    .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8; }
    .glitch::before { left: 2px; text-shadow: -2px 0 red; clip: rect(24px, 550px, 90px, 0); animation: glitch-anim 2.5s infinite linear alternate-reverse; }
    .glitch::after { left: -2px; text-shadow: -2px 0 blue; clip: rect(85px, 550px, 140px, 0); animation: glitch-anim 3s infinite linear alternate-reverse; }
    @keyframes glitch-anim {
      0% { clip: rect(11px, 9999px, 86px, 0); } 20% { clip: rect(65px, 9999px, 13px, 0); }
      40% { clip: rect(100px, 9999px, 10px, 0); } 60% { clip: rect(3px, 9999px, 80px, 0); }
      80% { clip: rect(40px, 9999px, 15px, 0); } 100% { clip: rect(95px, 9999px, 50px, 0); }
    }

    .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast {
      background: rgba(0, 0, 0, 0.85); color: #0f0; font-family: monospace; font-size: 14px;
      padding: 12px 24px; border-radius: 8px; border: 1px solid #0f0; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
      animation: toast-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, toast-out 0.3s 2.5s forwards;
    }
    @keyframes toast-in { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes toast-out { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50%); opacity: 0; } }
    
    .mobile-header, .mobile-overlay { display: none; }

    @media (max-width: 768px) {
      body { height: 100dvh; } 
      #app { display: flex; flex-direction: column; }
      
      .mobile-header {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 12px 20px; background: var(--bg-sidebar); backdrop-filter: blur(var(--blur-val)); -webkit-backdrop-filter: blur(var(--blur-val));
        border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 900;
      }
      .mh-left { display: flex; align-items: center; gap: 16px; flex: 1; }
      .mh-logo { color: #ff3b30; font-size: 26px; animation: heartbeat 1.5s infinite; cursor: pointer; }
      .mh-search-box { flex: 1; position: relative; }
      .mh-search-box input {
        width: 100%; padding: 10px 14px 10px 36px; border-radius: var(--radius-sm); font-size: 16px;
        background: rgba(128,128,128, 0.08); border: 1px solid transparent; color: var(--text-main);
      }
      .mh-search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-sub); }
      .mh-menu-btn { font-size: 26px; color: var(--text-main); cursor: pointer; }

      aside { 
        position: fixed; top: 0; left: -100%; bottom: 0; width: 280px; height: 100dvh;
        transition: left var(--transition-smooth); box-shadow: 10px 0 30px rgba(0,0,0,0.1);
      }
      aside.open { left: 0; }
      
      .mobile-overlay {
        display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 990;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      }
      .mobile-overlay.open { opacity: 1; pointer-events: auto; }

      main { padding: 24px 20px calc(80px + env(safe-area-inset-bottom)) 20px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
      .hero-quote { padding: 32px 24px; margin-bottom: 24px; }
      .quote-text { font-size: 28px; }
      #ghost-memo { width: auto; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); height: 65vh; }
    }
  </style>
</head>
<body>

  <div class="toast-container" id="toast-container"></div>
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <div id="panic-overlay">
    <div class="glitch-wrapper">
      <h1 class="glitch" data-text="404">404</h1>
      <p style="font-size: 24px; color: #666; font-family: var(--font-sys);">Not Found</p>
      <div style="margin-top: 20px; color: #999; font-size: 14px;">nginx/1.18.0 (Ubuntu)</div>
    </div>
  </div>

  <div id="splash">
    <div class="splash-quote">
      <p style="font-size: 28px; text-align: left; line-height: 1.8;">
        走了很长的路，也见过很多风景。<br>
        唯独星空深处的那轮明月最不认生。<br>
        它在异乡的窗前，守着当年我在故乡没做完的梦。<br>
        <br><br>
        回头看，<span onclick="closeSplash()" style="cursor: pointer; touch-action: manipulation; padding: 10px 5px; margin: -10px -5px; position: relative; z-index: 10;">轻舟</span>已过万重山；<br>
        向前看，长路漫漫亦灿烂。
      </p>
    </div>
  </div>

  <div id="app">
    <div class="mobile-header" id="mobile-header">
      <div class="mh-left">
        <div class="mh-logo" onclick="document.body.classList.toggle('dark-mode')"><i class="ri-heart-3-fill"></i></div>
        <div class="mh-search-box">
          <i class="ri-search-2-line"></i>
          <input type="text" class="search-input" placeholder="搜点什么...">
        </div>
      </div>
      <div class="mh-menu-btn" id="mobile-menu-btn"><i class="ri-menu-4-line"></i></div>
    </div>

    <aside id="sidebar">
      <div class="brand" id="theme-toggle" title="Toggle Theme">
        <div class="brand-logo"><i class="ri-heart-3-fill"></i></div>
        <div class="brand-text">
          <h1>JIN Tong</h1>
          <span>ARCHIVE</span>
        </div>
      </div>
        
      <div class="search-box">
        <i class="ri-search-2-line search-icon"></i>
        <input type="text" class="search-input" id="search-input" placeholder="搜点什么 (Ctrl+K)">
      </div>

      <div class="nav-scroll" id="nav-container"></div>

      <div class="aside-footer">
        <div class="time-badge">
            <span id="date-pill" style="margin-right: 4px;"></span>
            <span id="time-pill" style="font-weight: 600;">00:00</span>
            <span class="time-greeting" id="time-greeting">你好</span>
        </div>
      </div>
    </aside>

    <main id="main-content">
      <div class="hero-quote">
        <div class="quote-text">
          天下英雄如过江之鲫，人中龙凤尚且举步维艰。<br>我等鱼目，一生命运多舛，却从未失那颗赤子之心，<span class="secret-trigger" onclick="toggleMemo()">凌云</span>之志。
        </div>
        <div class="quote-sub">Long live freedom / The Visual Archive</div>
      </div>

      <a class="time-capsule" href="https://archive.org/" target="_blank" rel="noopener noreferrer">
        <div class="capsule-left">
            <div class="capsule-icon-box"><i class="ri-bank-line"></i></div>
            <div class="capsule-info">
                <span class="capsule-title">互联网档案馆</span>
                <span class="capsule-desc">查询全球互联网历史页面的免费数据库</span>
            </div>
        </div>
        <div class="capsule-arrow"><i class="ri-arrow-right-line"></i></div>
      </a>

      <div id="empty-state" class="hidden">
        <i class="ri-ghost-line"></i>
        <p>当前象限未捕捉到相关信号...</p>

  <div id="ghost-memo">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border-color);">
      <span style="font-size:15px; font-weight:700; letter-spacing:1px;">云端手记</span>
      <div style="display:flex; gap:14px; align-items:center;">
        <span id="cloud-status" style="font-size:12px; font-family:var(--font-sys); font-weight:600; color:var(--accent);">待机中</span>
        <span id="cloud-sync-btn" style="cursor:pointer; font-size:13px; font-weight:bold; opacity:0.7; transition:opacity var(--transition-fast);" title="强制同步" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">同步</span>
        <span onclick="toggleMemo()" style="cursor:pointer; font-size:13px; font-weight:bold; opacity:0.7; transition:opacity var(--transition-fast);" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">关闭</span>
      </div>
    </div>
    <div id="memo-content"></div>
    <input type="text" id="memo-new-record" placeholder="写入新记录，回车封存..." autocomplete="off" />
  </div>

  <script>
    // --- 核心交互逻辑 (保留原貌) ---
    const sidebar = document.getElementById('sidebar');
    const mobileOverlay = document.getElementById('mobile-overlay');
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    
    function toggleMobileMenu() {
        if(window.innerWidth <= 768) {
            sidebar.classList.toggle('open');
            mobileOverlay.classList.toggle('open');
        }
    }
    
    if (mobileMenuBtn && mobileOverlay) {
        mobileMenuBtn.addEventListener('click', toggleMobileMenu);
        mobileOverlay.addEventListener('click', toggleMobileMenu);
    }

    function animateCards() {
      const cards = document.querySelectorAll('.card');
      cards.forEach((card, index) => {
        card.style.animationDelay = `${(index % 12) * 0.05}s`;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const navContainer = document.getElementById('nav-container');
      const sections = document.querySelectorAll('.section-block');
      
      sections.forEach(sec => {
        if (sec.classList.contains('sensitive-zone')) return; 

        const id = sec.id;
        const iconClass = sec.dataset.icon || 'ri-links-line';
        const titleEl = sec.querySelector('.section-title');
        if (!titleEl) return;
        const title = titleEl.textContent.trim();
        
        const link = document.createElement('a');
        link.className = 'nav-item';
        link.href = '#' + id;
        link.innerHTML = `<i class="${iconClass} nav-icon"></i> ${title}`;
        
        link.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
          document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
          link.classList.add('active');
          if(window.innerWidth <= 768) toggleMobileMenu();
        });
        
        navContainer.appendChild(link);
      });

      animateCards();
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.body.classList.add('dark-mode');
      }
    });

    // 优化：使用 visibility 和 opacity 平滑控制防闪烁
    function closeSplash() {
      const splash = document.getElementById('splash');
      if(splash) {
          splash.style.opacity = '0';
          setTimeout(() => { 
            splash.style.visibility = 'hidden'; 
            splash.style.display = 'none';
          }, 600);
          sessionStorage.setItem('archiveSplashSeen', 'true');
      }
    }
    if (sessionStorage.getItem('archiveSplashSeen')) {
      const splash = document.getElementById('splash');
      if(splash) {
          splash.style.display = 'none';
          splash.style.visibility = 'hidden';
      }
    }

    // 严谨级优化：将 DOM 节点缓存到外部，避免每秒重复遍历查询
    const timePill = document.getElementById('time-pill');
    const datePill = document.getElementById('date-pill');
    const greeting = document.getElementById('time-greeting');
    
    function updateTime() {
      const now = new Date();
      if(timePill) timePill.textContent = now.toLocaleTimeString('zh-CN', {hour12:false});
      if(datePill) {
        const dateOptions = { month: 'long', day: 'numeric' };
        datePill.textContent = now.toLocaleDateString('zh-CN', dateOptions);
      }
      if(greeting) {
        const hour = now.getHours();
        if (hour < 5) greeting.textContent = '夜深了';
        else if (hour < 9) greeting.textContent = '早上好';
        else if (hour < 12) greeting.textContent = '上午好';
        else if (hour < 14) greeting.textContent = '中午好';
        else if (hour < 19) greeting.textContent = '下午好';
        else greeting.textContent = '晚上好';
      }
    }
    setInterval(updateTime, 1000); 
    updateTime();

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = `> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
    }

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function filterCards(term) {
        document.querySelectorAll('.section-block').forEach(sec => {
            if (sec.classList.contains('locked') && term !== 'open') {
                sec.style.display = 'none';
                return;
            }

            let hasVisibleCard = false;
            sec.querySelectorAll('.card').forEach(card => {
                const text = card.textContent.toLowerCase();
                const isMatch = text.includes(term);
                card.style.display = isMatch ? 'flex' : 'none';
                if (isMatch) hasVisibleCard = true;
            });
            
            sec.style.display = (hasVisibleCard || term === '') ? 'block' : 'none';
        });
        animateCards(); 
    }

    const debouncedFilter = debounce(filterCards, 150);

    function toggleAbyss() {
      const secretZones = document.querySelectorAll('.sensitive-zone');
      let isUnlocking = false;

      secretZones.forEach(zone => {
        zone.classList.toggle('locked');
        if (!zone.classList.contains('locked')) {
            isUnlocking = true;
            zone.style.display = 'block'; 
        }
      });

      if (isUnlocking && secretZones.length > 0) {
         showToast("深海区域已解禁。"); 
         if (window.innerWidth <= 768) {
             sidebar.classList.remove('open');
             mobileOverlay.classList.remove('open');
         }
         setTimeout(() => { secretZones[0].scrollIntoView({ behavior: 'smooth' }); }, 50);
      } else {
         showToast("连接已终止。");
      }
    }

    const searchInputs = document.querySelectorAll('.search-input');
    searchInputs.forEach(input => {
      input.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        
        if (term === 'open') {
          searchInputs.forEach(inp => { inp.value = ''; });
          filterCards(''); 
          toggleAbyss();
          return;
        }

        searchInputs.forEach(inp => { if(inp !== e.target) inp.value = term; });
        debouncedFilter(term);
      });
    });

    let secretCode = '';
    document.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      const isInputActive = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');

      if (e.key === 'Escape') {
        if (isInputActive) { activeEl.blur(); return; }
        const panicOverlay = document.getElementById('panic-overlay');
        const app = document.getElementById('app');
        if (panicOverlay.classList.contains('active')) {
          panicOverlay.classList.remove('active');
          app.style.filter = 'none';
        } else {
          panicOverlay.classList.add('active');
          app.style.filter = 'blur(10px) grayscale(100%)'; 
        }
        return; 
      }

      if((e.metaKey || e.ctrlKey) && e.key === 'k') { 
          e.preventDefault(); 
          const visibleSearch = Array.from(searchInputs).find(i => i.offsetParent !== null);
          if (visibleSearch) visibleSearch.focus(); 
          return;
      }

      if(isInputActive) return;
      
      secretCode += e.key.toLowerCase();
      if (secretCode.length > 4) secretCode = secretCode.slice(-4);
      
      if (secretCode === 'open') {
        toggleAbyss();
        secretCode = ''; 
      }
    });

    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });

    window.toggleMemo = function() {
      const ghostMemo = document.getElementById('ghost-memo');
      const isActive = ghostMemo.classList.toggle('active');
      
      if(isActive) {
          if (typeof window.loadFromCloud === 'function') {
              window.loadFromCloud();
          }
          setTimeout(() => {
              document.getElementById('memo-new-record').focus();
          }, 300); 
      }
    }
  </script>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // --- Supabase 云端同步优化 ---
    function formatTime(isoString) {
      const date = new Date(isoString);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    if (typeof window.supabase !== 'undefined') {
        const SUPABASE_URL = 'https://nwyjvswvgkilgsggnnid.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_wCF407WM8NaCF-WTKn_rlg_DBOhamPx';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const memoContent = document.getElementById('memo-content');
        const memoNewRecord = document.getElementById('memo-new-record');
        const statusText = document.getElementById('cloud-status');

        const resetStatus = (triggerText) => {
            setTimeout(() => { 
                if(statusText.textContent === triggerText) {
                    statusText.textContent="已连接";
                    statusText.style.color="var(--accent)";
                }
            }, 1500);
        };

        window.copyMemo = async function(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast("已复制到剪贴板");
            } catch (err) {
                console.error("Failed to copy!", err);
            }
        };

        function renderMemos(data) {
            memoContent.innerHTML = '';
            if (!data || data.length === 0) {
                memoContent.innerHTML = '<div style="opacity:0.4; text-align:center; margin-top:40px; font-size:13px; font-family:var(--font-sys);">记忆之海干涸，输入点什么吧...</div>';
                return;
            }
            data.forEach(row => {
                const item = document.createElement('div');
                item.className = 'memo-item';
                item.id = `memo-${row.id}`;
                
                const safeContent = row.content.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                
                item.innerHTML = `
                    <div style="flex:1;">
                        <span class="memo-time">${formatTime(row.created_at)}</span>
                        <div class="memo-text" title="点击复制" onclick="copyMemo('${safeContent}')">${row.content}</div>
                    </div>
                    <span class="memo-delete" onclick="deleteMemo('${row.id}')" title="抹除此条记录">×</span>
                `;
                memoContent.appendChild(item);
            });
            requestAnimationFrame(() => {
                memoContent.scrollTop = memoContent.scrollHeight;
            });
        }

        window.loadFromCloud = async function() {
          statusText.textContent = "同步中...";
          statusText.style.color = "var(--text-main)";
          try {
            const { data, error } = await supabase
              .from('memos')
              .select('id, content, created_at')
              .order('created_at', { ascending: true }); 

            if (error) throw error;
            
            renderMemos(data);
            statusText.textContent = "已连接";
            statusText.style.color = "var(--accent)";
          } catch (err) {
            console.error("[Data Load Error]:", err);
            statusText.textContent = "连接失败";
            statusText.style.color = "#ff3b30";
          }
        };

        window.deleteMemo = async function(id) {
            if(!confirm('数据消除确认：此操作不可逆。')) return;
            statusText.textContent = "删除中...";
            try {
                const { error } = await supabase.from('memos').delete().eq('id', id);
                if (error) throw error;
                
                const targetNode = document.getElementById(`memo-${id}`);
                if (targetNode) {
                    targetNode.style.opacity = '0';
                    setTimeout(() => targetNode.remove(), 200);
                }
                
                statusText.textContent = "已删除";
                resetStatus("已删除");
            } catch (err) {
                console.error("[Delete Error]:", err);
                statusText.textContent = "删除被拦截";
                statusText.style.color = "#ff3b30";
            }
        };

        memoNewRecord.addEventListener('keydown', async function(e) {
          if (e.key === 'Enter') {
            e.preventDefault(); 
            
            const newText = this.value.trim();
            if (newText === '') return;

            this.value = ''; 
            this.disabled = true; 
            statusText.textContent = "发送中...";
            
            try {
              const { error } = await supabase.from('memos').insert([{ content: newText }]); 
              if (error) throw error;
              
              statusText.textContent = "已封存";
              resetStatus("已封存");
            } catch (err) {
              console.error("[Save Error]:", err);
              statusText.textContent = "保存失败";
              statusText.style.color = "#ff3b30";
              this.value = newText; 
            } finally {
              this.disabled = false;
              this.focus();
            }
          }
        });

        // 严谨级优化：给实时拉取加入防抖，防止自己在网页输入时产生的自我反馈引发二次渲染闪烁
        const debouncedLoadFromCloud = debounce(window.loadFromCloud, 800);
        
        try {
            supabase.channel('public:memos')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'memos' }, payload => {
                debouncedLoadFromCloud();
                statusText.textContent = "实时更新";
                resetStatus("实时更新");
              }).subscribe();
        } catch (err) {
            console.warn("Realtime subscription disabled or failed.");
        }

        document.getElementById('cloud-sync-btn').addEventListener('click', window.loadFromCloud);
    } else {
        document.getElementById('cloud-status').textContent = "离线状态";
        document.getElementById('cloud-status').style.color = "#ff3b30";
    }
  </script>
</body>
