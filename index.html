    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.007); // 制造边缘消散的深邃感

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 24);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(varAccentToHex(), 1.5, 60);
    camera.add(pointLight);
    scene.add(camera);

    function varAccentToHex() { return 0x0a84ff; }

    // 材质生成器 (规避 DOM 性能开销的核心，通过 Canvas 绘制纹理交由 GPU 处理)
    function createCardTexture(title, desc, icon, isSecret) {
      const cvs = document.createElement('canvas');
      cvs.width = 512; cvs.height = 288;
      const ctx = cvs.getContext('2d');

      // 背景与描边
      ctx.fillStyle = isSecret ? 'rgba(30, 10, 10, 0.95)' : 'rgba(25, 25, 28, 0.9)';
      ctx.beginPath(); ctx.roundRect(0, 0, cvs.width, cvs.height, 24); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = isSecret ? 'rgba(255, 59, 48, 0.3)' : 'rgba(255, 255, 255, 0.15)';
      ctx.stroke();

      // 排版
      ctx.font = '55px system-ui'; ctx.fillStyle = '#ffffff';
      ctx.fillText(icon, 40, 90);
      
      ctx.font = 'bold 42px system-ui';
      ctx.fillText(title, 40, 170);
      
      ctx.font = '24px system-ui'; ctx.fillStyle = '#888888';
      ctx.fillText(desc, 40, 230);

      const tex = new THREE.CanvasTexture(cvs);
      tex.minFilter = THREE.LinearFilter;
      return tex;
    }

    const cardMeshes = [];
    const cardGeometry = new THREE.PlaneGeometry(8, 4.5);
    let globalYOffset = 6;
    const X_START = -10.5; const X_STEP = 10.5;
    let maxDepth = 0;

    // 引擎装载数据
    rawArchiveData.forEach(([catName, isSecretFlag, items]) => {
      const isSecret = isSecretFlag === 1;

      // 分类标题
      const tCvs = document.createElement('canvas'); tCvs.width = 1024; tCvs.height = 128;
      const tCtx = tCvs.getContext('2d');
      tCtx.font = 'bold 60px system-ui'; tCtx.fillStyle = isSecret ? '#ff3b30' : '#ffffff'; tCtx.textAlign = 'center';
      tCtx.fillText(isSecret ? "[ CONFIDENTIAL ABYSS ]" : `— ${catName} —`, 512, 80);
      const tMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(tCvs), transparent: true, opacity: isSecret ? 0 : 1 });
      const tMesh = new THREE.Mesh(new THREE.PlaneGeometry(16, 2), tMat);
      tMesh.position.set(0, globalYOffset, 0); tMesh.isSecret = isSecret; tMesh.isTitle = true;
      scene.add(tMesh);
      cardMeshes.push(tMesh); // 加入追踪列以便搜索/加密控制
      
      globalYOffset -= 5;

      // 卡片矩阵分布
      items.forEach((item, index) => {
        const [title, desc, icon, href] = item;
        const mat = new THREE.MeshBasicMaterial({ 
          map: createCardTexture(title, desc, icon, isSecret), 
          transparent: true, opacity: isSecret ? 0 : 1 
        });
        const mesh = new THREE.Mesh(cardGeometry, mat);
        
        const col = index % 3;
        const row = Math.floor(index / 3);
        
        mesh.position.x = X_START + (col * X_STEP);
        mesh.position.y = globalYOffset - (row * 6);
        // 微弱的 Z 轴随机深度，增加 3D 纵深视差
        mesh.position.z = (Math.random() - 0.5) * 1.5;

        mesh.userData = { href, originalY: mesh.position.y, title: title.toLowerCase(), desc: desc.toLowerCase() };
        mesh.isSecret = isSecret;
        
        scene.add(mesh);
        cardMeshes.push(mesh);
        
        maxDepth = Math.min(maxDepth, mesh.position.y);
      });
      const rows = Math.ceil(items.length / 3);
      globalYOffset -= (rows * 6) + 4;
    });

    // =========================================================================
    // 3. 物理插值与视口同步 (完美规避浏览器原生滚动重排)
    // =========================================================================
    let targetCameraY = 0;
    let currentCameraY = 0;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-2, -2);
    let hoveredMesh = null;

    function handleScroll(deltaY) {
      targetCameraY -= deltaY * 0.04;
      // 边界锁定计算
      targetCameraY = Math.min(6, Math.max(maxDepth - 10, targetCameraY));
      document.getElementById('scroll-hint').style.opacity = '0';
    }

    window.addEventListener('wheel', e => handleScroll(e.deltaY), { passive: true });

    let touchY = 0;
    window.addEventListener('touchstart', e => touchY = e.touches[0].clientY, {passive: true});
    window.addEventListener('touchmove', e => {
      const delta = touchY - e.touches[0].clientY;
      handleScroll(delta * 2.5);
      touchY = e.touches[0].clientY;
    }, {passive: true});

    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // 交互触发器
    window.addEventListener('click', () => {
      if (hoveredMesh && hoveredMesh.userData.href) {
        if (!hoveredMesh.isSecret || isAbyssOpen) {
          window.open(hoveredMesh.userData.href, '_blank');
        }
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 核心渲染循环
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // 1. Lerp 缓动摄像机 (丝滑感来源)
      currentCameraY = THREE.MathUtils.lerp(currentCameraY, targetCameraY, 0.07);
      camera.position.y = currentCameraY;

      // 2. 赋予卡片流体力学般的呼吸感
      cardMeshes.forEach((mesh, i) => {
        if (!mesh.isTitle) {
          mesh.position.y = mesh.userData.originalY + Math.sin(time * 1.5 + i * 0.1) * 0.15;
          // 根据摄像机位置进行反向扭曲视差
          mesh.rotation.y = THREE.MathUtils.lerp(mesh.rotation.y, (camera.position.x - mesh.position.x) * 0.015, 0.1);
          mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, (camera.position.y - mesh.position.y) * 0.015, 0.1);
        }
      });

      // 3. 光线投射检测悬停
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cardMeshes.filter(m => !m.isTitle));
      
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (!obj.isSecret || isAbyssOpen) {
          if (hoveredMesh !== obj) {
            if (hoveredMesh) gsap.to(hoveredMesh.scale, {x: 1, y: 1, z: 1, duration: 0.3});
            hoveredMesh = obj;
            gsap.to(hoveredMesh.scale, {x: 1.08, y: 1.08, z: 1.08, duration: 0.4, ease: "back.out(1.5)"});
            document.body.style.cursor = 'pointer';
          }
        }
      } else if (hoveredMesh) {
        gsap.to(hoveredMesh.scale, {x: 1, y: 1, z: 1, duration: 0.3});
        hoveredMesh = null;
        document.body.style.cursor = 'default';
      }

      renderer.render(scene, camera);
    }
    animate();

    // =========================================================================
    // 4. 全局业务逻辑 (搜索、深海密码、Toast)
    // =========================================================================
    let isAbyssOpen = false;
    let secretCode = '';
    
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = `> ${msg}`; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // 搜索实时过滤 (不操作 DOM，直接操作 3D 材质显影)
    document.getElementById('search-input').addEventListener('input', e => {
      const term = e.target.value.toLowerCase().trim();
      cardMeshes.forEach(mesh => {
        if (mesh.isSecret && !isAbyssOpen) return;
        if (mesh.isTitle) { gsap.to(mesh.material, { opacity: term ? 0.1 : 1, duration: 0.3 }); return; }
        
        const match = !term || mesh.userData.title.includes(term) || mesh.userData.desc.includes(term);
        gsap.to(mesh.material, { opacity: match ? 1 : 0.05, duration: 0.3 });
        gsap.to(mesh.scale, { x: match?1:0.95, y: match?1:0.95, duration: 0.3 });
      });
    });

    document.addEventListener('keydown', e => {
      const activeEl = document.activeElement;
      const isInput = activeEl.tagName === 'INPUT';

      if (e.key === 'Escape') {
        if (isInput) { activeEl.blur(); return; }
        document.getElementById('panic-overlay').classList.toggle('active');
        return;
      }
      
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); return; }
      if (isInput) return;
      if (e.key === 'm' || e.key === 'M') { toggleMemo(); return; }

      secretCode += e.key.toLowerCase();
      if (secretCode.length > 4) secretCode = secretCode.slice(-4);
      if (secretCode === 'open') { 
        isAbyssOpen = !isAbyssOpen; secretCode = '';
        showToast(isAbyssOpen ? "ABYSS PROTOCOL: OVERRIDE ENABLED" : "ABYSS PROTOCOL: SECURED");
        
        // 渲染显影动画
        cardMeshes.forEach(mesh => {
          if (mesh.isSecret) {
            gsap.to(mesh.material, { opacity: isAbyssOpen ? 1 : 0, duration: 1.2, ease: "power2.inOut" });
            if (isAbyssOpen) gsap.fromTo(mesh.position, {z: -5}, {z: (Math.random()-0.5)*1.5, duration: 1.2, ease: "back.out"});
          }
        });
      }
    });

    setInterval(() => {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {hour12: false});
    }, 1000);

    // =========================================================================
    // 5. Supabase 备忘录中枢 (全量提取原码逻辑)
    // =========================================================================
    window.toggleMemo = function() {
      const ghostMemo = document.getElementById('ghost-memo');
      const isActive = ghostMemo.classList.toggle('active');
      if (isActive) {
        if (typeof window.loadFromCloud === 'function') window.loadFromCloud();
        setTimeout(() => document.getElementById('memo-new-record').focus(), 300);
      }
    };

    if (typeof window.supabase !== 'undefined') {
      const SUPABASE_URL = 'https://nwyjvswvgkilgsggnnid.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_wCF407WM8NaCF-WTKn_rlg_DBOhamPx';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const memoContent = document.getElementById('memo-content');
      const memoNewRecord = document.getElementById('memo-new-record');
      const statusText = document.getElementById('cloud-status');

      const setStatus = (text, color = 'var(--text-main)', autoReset = true) => {
        statusText.textContent = text; statusText.style.color = color;
        if (autoReset) setTimeout(() => { if (statusText.textContent === text) { statusText.textContent = '已连接'; statusText.style.color = 'var(--accent)'; }}, 1500);
      };

      const formatTime = (isoString) => {
        const d = new Date(isoString);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      };

      window.copyMemo = async function(text) {
        try { await navigator.clipboard.writeText(text); showToast('已复制到剪贴板'); } catch (err) {}
      };

      function renderMemos(data) {
        memoContent.innerHTML = '';
        if (!data || data.length === 0) {
          memoContent.innerHTML = '<div style="opacity:.4;text-align:center;margin-top:40px;font-size:13px;">记忆之海干涸，输入点什么吧...</div>';
          return;
        }
        data.forEach(row => {
          const item = document.createElement('div');
          item.className = 'memo-item'; item.id = `memo-${row.id}`;
          const safeContent = row.content.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '"');
          item.innerHTML = `
            <div style="flex:1;">
              <span class="memo-time">${formatTime(row.created_at)}</span>
              <div class="memo-text" title="点击复制" onclick="copyMemo('${safeContent}')">${row.content}</div>
            </div>
            <span class="memo-delete" onclick="deleteMemo('${row.id}')" title="抹除此条记录">×</span>
          `;
          memoContent.appendChild(item);
        });
        requestAnimationFrame(() => memoContent.scrollTop = memoContent.scrollHeight);
      }

      window.loadFromCloud = async function() {
        setStatus('同步中...', 'var(--text-main)', false);
        try {
          const { data, error } = await supabase.from('memos').select('id, content, created_at').order('created_at', { ascending: true });
          if (error) throw error;
          renderMemos(data); setStatus('已连接', 'var(--accent)', false);
        } catch (err) { setStatus('连接失败', '#ff3b30', false); }
      };

      window.deleteMemo = async function(id) {
        if (!confirm('数据消除确认：此操作不可逆。')) return;
        setStatus('删除中...', 'var(--text-main)', false);
        try {
          const { error } = await supabase.from('memos').delete().eq('id', id);
          if (error) throw error;
          const target = document.getElementById(`memo-${id}`);
          if (target) { target.style.opacity = '0'; setTimeout(() => target.remove(), 200); }
          setStatus('已删除', 'var(--text-main)');
        } catch (err) { setStatus('删除失败', '#ff3b30', false); }
      };

      memoNewRecord.addEventListener('keydown', async function(e) {
        if (e.key === 'Enter') {
          e.preventDefault(); const newText = this.value.trim(); if (!newText) return;
          this.value = ''; this.disabled = true; setStatus('发送中...', 'var(--text-main)', false);
          try {
            const { error } = await supabase.from('memos').insert([{ content: newText }]);
            if (error) throw error; setStatus('已封存', 'var(--text-main)'); window.loadFromCloud();
          } catch (err) { setStatus('保存失败', '#ff3b30', false); this.value = newText; } 
          finally { this.disabled = false; this.focus(); }
        }
      });

      document.getElementById('cloud-sync-btn').addEventListener('click', window.loadFromCloud);
    }
  </script>
</body>
